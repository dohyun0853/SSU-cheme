<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>390px 확인용</title>
<style>
  html,body{margin:0;padding:0;background:#6b7280;}
  #host{display:block;padding:16px;}
  iframe{border:0;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.35);display:block;}
  #out{color:#fff;font:12px/1.55 ui-monospace,monospace;white-space:pre-wrap;margin:0 16px 20px;background:#111827;padding:10px;max-width:760px;}
</style>
</head>
<body>
<div id="host"></div>
<pre id="out">checking…</pre>
<script>
  // ?p=index.html%3Flang%3Den%23about&h=844&w=390&y=0
  var q = new URLSearchParams(location.search);
  var w = Number(q.get('w') || 390);
  var h = Number(q.get('h') || 844);
  var y = Number(q.get('y') || 0);
  var host = document.getElementById('host');
  var root = host.attachShadow ? host.attachShadow({ mode: 'closed' }) : host;
  var f = document.createElement('iframe');
  f.width = w; f.height = h; f.setAttribute('scrolling', 'no'); f.setAttribute('title', 'preview');
  root.appendChild(f);
  var out = document.getElementById('out');
  f.addEventListener('load', function () {
    try {
      var d = f.contentDocument, win = f.contentWindow;
      if (y) win.scrollTo(0, y);
      var click = q.get('click');
      if (click === 'year3') { var t3 = d.querySelector('.year-tab[data-year="3"]'); if (t3) t3.click(); }
      if (click === 'notice') { var nb = d.querySelector('.notice-link'); if (nb) nb.click(); }
      if (click === 'greeting') { var gb = d.querySelector('[data-tab="greeting"]'); if (gb) gb.click(); }
      var lines = [];
      var de = d.documentElement;
      lines.push(f.src.split('/').pop() + '  ·  viewport ' + win.innerWidth + ' / doc ' + de.scrollWidth + ' / body ' + d.body.scrollWidth);
      if (de.scrollWidth > win.innerWidth + 1) lines.push('!! PAGE HORIZONTAL OVERFLOW: ' + de.scrollWidth);
      var bad = [];
      d.querySelectorAll('body *').forEach(function (el) {
        if (!el.offsetParent && el.tagName !== 'BODY') return;
        var cs = win.getComputedStyle(el);
        if (cs.overflowX === 'auto' || cs.overflowX === 'scroll' || cs.webkitLineClamp !== 'none') return;
        if (el.closest('.pillar-stack, .notice-title, .notice-modal, [data-no-check]')) return;
        var over = el.scrollWidth - el.clientWidth;
        if (over > 2 && el.clientWidth > 0) {
          bad.push(el.tagName.toLowerCase() + (el.id ? '#' + el.id : '') + '.' + (el.className || '').toString().split(' ').slice(0, 2).join('.') + ' +' + over + 'px "' + (el.textContent || '').trim().slice(0, 26) + '"');
        }
      });
      if (bad.length) { lines.push('!! CLIPPED (' + bad.length + '):'); bad.slice(0, 14).forEach(function (b) { lines.push('  - ' + b); }); }
      else lines.push('clipped: none');
      out.textContent = lines.join('\n');
      document.title = (de.scrollWidth > win.innerWidth + 1 ? 'OVERFLOW ' : 'OK ') + f.src.split('/').pop();
    } catch (e) { out.textContent = 'CHECK FAILED: ' + e.message; }
  });
  document.getElementById('host').insertAdjacentHTML('beforebegin', '<p style="color:#fff;font:600 13px system-ui;margin:12px 16px 0;">' + w + 'px · ' + (q.get('p') || 'index.html') + '</p>');
  f.src = q.get('p') || 'index.html';
</script>
</body>
</html>
