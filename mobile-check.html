<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>390px 확인용</title>
<style>
  html,body{margin:0;padding:0;background:#6b7280;}
  .frame-box{display:flex;gap:24px;padding:16px;align-items:flex-start;}
  iframe{border:0;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .cap{color:#fff;font:600 13px/1.4 system-ui;margin:0 0 10px;}
</style>
</head>
<body>
<div class="frame-box">
  <div>
    <p class="cap" id="cap">390px</p>
    <iframe id="f" src="index.html" width="390" height="844" scrolling="no" aria-hidden="true" tabindex="-1" sandbox="allow-scripts allow-popups"></iframe>
  </div>
</div>
<script>
  // ?p=index.html%3Flang%3Den%23about&h=844&w=390&y=0
  var q = new URLSearchParams(location.search);
  var f = document.getElementById('f');
  var w = Number(q.get('w') || 390);
  var h = Number(q.get('h') || 844);
  var y = Number(q.get('y') || 0);
  f.width = w; f.height = h;
  document.getElementById('cap').textContent = w + 'px · ' + (q.get('p') || 'index.html');
  f.addEventListener('load', function () {
    if (y) { try { f.contentWindow.scrollTo(0, y); } catch (e) {} }
    if (q.get('open') === 'notice') {
      try {
        var b = f.contentDocument.querySelector('.notice-link');
        if (b) b.click();
      } catch (e) {}
    }
  });
  f.src = q.get('p') || 'index.html';
</script>
</body>
</html>
